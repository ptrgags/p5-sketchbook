<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      language="javascript"
      type="text/javascript"
      src="../libraries/p5.min.js"
    ></script>
    <script type="module">
      import { sketch } from "./PenroseTriangulation.js";
      import "../sketchlib/sketchbook-navbar.js";
      const p5_sketch = new p5(sketch, "sketch");
    </script>
    <link rel="stylesheet" href="../styles/layout.css" />
  </head>
  <body>
    <sketchbook-navbar></sketchbook-navbar>
    <div class="container">
      <h1>Penrose Triangulation 🧪 (2026-07)</h1>
      <div class="sketch">
        <canvas id="sketch-canvas" width="500" height="700"></canvas>
      </div>
      <div class="description">
        This sketch is a generalization of the
        <a href="https://en.wikipedia.org/wiki/Penrose_triangle"
          >Penrose Triangle</a
        >
        illusion - Take a triangular grid and interpret it as connectivity
        between cubes in isometric projection. Closed triangles become Penrose
        triangles.
      </div>
    </div>
  </body>
